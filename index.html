<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videy - play videos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#101522;
}

header{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    font-size:40px;
    font-weight:800;
    letter-spacing:-3px;
}

.nav{
    display:flex;
    align-items:center;
    gap:25px;
}

.signup{
    font-size:20px;
    font-weight:600;
}

.upload-top{
    background:#101827;
    color:white;
    text-decoration:none;
    padding:18px 32px;
    border-radius:40px;
    font-size:19px;
    font-weight:700;
}

.hero{
    min-height:calc(100vh - 90px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px 100px;
}

.hero h1{
    font-size:64px;
    line-height:1.05;
    letter-spacing:-3px;
    max-width:800px;
}

.hero h1 span{
    color:#5d6676;
}

.subtitle{
    margin-top:55px;
    font-size:28px;
    color:#303746;
}

.main-button{
    display:inline-block;
    margin-top:70px;
    padding:24px 70px;
    border-radius:50px;
    background:#101827;
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:700;
    transition:.25s;
}

.main-button:hover{
    transform:scale(1.04);
}

footer{
    position:fixed;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#a1a6af;
    font-size:16px;
}

footer a{
    color:#a1a6af;
    text-decoration:none;
    margin:0 35px;
}

/* HP */
@media(max-width:600px){

    header{
        height:80px;
        padding:0 25px;
    }

    .logo{
        font-size:34px;
    }

    .signup{
        display:none;
    }

    .upload-top{
        padding:15px 24px;
        font-size:17px;
    }

    .hero{
        min-height:calc(100vh - 80px);
        padding:30px 25px 100px;
    }

    .hero h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .subtitle{
        margin-top:45px;
        font-size:22px;
        line-height:1.4;
    }

    .main-button{
        margin-top:55px;
        padding:21px 55px;
        font-size:20px;
    }

    footer{
        font-size:14px;
        bottom:18px;
    }

    footer a{
        margin:0 12px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">videy</div>

    <div class="nav">
        <div class="signup">login</div>

        <a class="upload-top"
           href="https://sireimplement.com/n41kbwakyi?key=b1f7c5c91a40414911c99301689e6c69"
           target="_blank">
           play
        </a>
    </div>

</header>


<section class="hero">

    <h1>
        Upload your videos<br>
        <span>and share</span>
    </h1>

    <p class="subtitle">
        Free and simple video hosting.
    </p>

    <a class="main-button"
       href="https://sireimplement.com/n41kbwakyi?key=b1f7c5c91a40414911c99301689e6c69"
       target="_blank">
       Play Video
    </a>

</section>


<footer>
    <a href="#">Terms of Service</a>
    <a href="#">Report Abuse</a>
</footer>

</body>
</html>
